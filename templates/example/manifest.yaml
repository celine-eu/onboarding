slug: example
name: "CER Valle del Sole"
locale: it

# Keycloak organization alias that owns this community — OPTIONAL, and the
# tenancy key for the admin console. Operators are authorised by membership of
# this organization plus one of its admins/managers/editors/viewers groups, so
# this is what decides who may review *this* community's submissions and nobody
# else's.
#
# The same identifier as `dataspace.organization` below when that block is
# present; `task import-templates` refuses a manifest where the two disagree, and
# resolves this from the dataspace block when only that one is set.
#
# Omit it and the community is administrable only by *platform* operators holding
# a realm-level group — a coherent setup for a single-community deployment. It
# fails closed either way: no organization means no per-community grant matches.
# The organization must already exist in Keycloak, with its role-hierarchy groups
# created (`celine-policies keycloak sync-users` does both). Onboarding never
# creates one.
#
# organization: example-community

branding:
  primary_color: "#0d9488"
  logo: assets/logo.svg

fields:
  extra:
    - key: property_type
      label: "Tipo di immobile"
      "label:en": "Property type"
      type: select
      step: energy
      options:
        - value: residential
          label: "Abitazione"
          "label:en": "Residential"
        - value: condominium
          label: "Condominio"
          "label:en": "Condominium"
        - value: commercial
          label: "Attivita' commerciale"
          "label:en": "Commercial"
        - value: other
          label: "Altro"
          "label:en": "Other"
    - key: has_pv
      label: "Ho un impianto fotovoltaico"
      "label:en": "I have a photovoltaic system"
      type: boolean
      step: energy
    - key: pv_kwp
      label: "Potenza impianto (kWp)"
      "label:en": "System power (kWp)"
      type: number
      step: energy
      suffix: kWp
      placeholder: "es. 6"
      show_if: { key: has_pv, value: true }
    - key: has_battery
      label: "Ho un sistema di accumulo (batteria)"
      "label:en": "I have a battery storage system"
      type: boolean
      step: energy
      show_if: { key: has_pv, value: true }
    - key: battery_kwh
      label: "Capacita' batteria (kWh)"
      "label:en": "Battery capacity (kWh)"
      type: number
      step: energy
      suffix: kWh
      placeholder: "es. 10"
      show_if: { key: has_battery, value: true }
    - key: has_ev
      label: "Ho un'auto elettrica"
      "label:en": "I have an electric vehicle"
      type: boolean
      step: energy
    - key: has_heat_pump
      label: "Ho una pompa di calore"
      "label:en": "I have a heat pump"
      type: boolean
      step: energy
  hidden: []

consent:
  gdpr:
    version: "1.0"
    file: consent/gdpr.pdf
    required: true
  policy:
    version: "1.0"
    file: consent/policy.pdf
    required: true
  statute:
    version: "1.0"
    file: consent/statute.pdf
    required: true
  # Data-sharing consent — OPTIONAL, and **off in the default deployment**, which
  # is why it is commented out rather than merely documented as optional.
  #
  # The default flow is: a person preregisters, a REC manager reviews and
  # accepts, the participant gets a login. No dataspace anywhere in it. Declaring
  # this block opts the community *in*, and the block is not free: the wizard has
  # to render the offers from the published vocabulary, so the deployment then
  # needs DS_NS_URL or DS_CONNECTOR_URL and startup refuses without one. A clone
  # with no dataspace could not boot while this was live.
  #
  # Uncomment it together with `statute` in `steps:` below — the offers render in
  # that step and nowhere else.
  #
  # GDPR Art. 7(4): REC membership must never be conditioned on dataspace
  # sharing, so the wizard permits completion with this off and can_submit does
  # not list it. No version/file here — the version comes from each offer's
  # consent_text_version served by the connector, so it cannot drift from what ds
  # enforces. `offers` is an optional allow-list; omit it to offer every
  # consent-based offer the connector publishes.
  #
  # data_sharing:
  #   required: false
  #   offers:
  #     - household-energy-flexibility

# REC registry binding — OPTIONAL, per community. Omit it and approved
# participants are not registered as community members; the wizard still works.
#
# `areas` maps each registry area key to the municipalities it covers. This is
# how an area is defined — the platform does not use geoshapes — so the match is
# against the member's municipality: the one the eligibility geocoder resolved,
# or the bill extraction's `comune` when that step did not run. `default_area`
# catches anyone whose municipality is not listed. A municipality claimed by two
# areas is refused at import, since the outcome would otherwise depend on
# declaration order.
#
# No assets are registered. Self-stated answers are declarations, not
# commissioned installations, and a meter's sensor_id only exists after the
# device is installed. The POD *is* tracked — it is known up front and is what
# the distributor keys on.
#
# rec_registry:
#   community: example-community       # community key in the REC registry
#   default_area: north                # when no area covers the municipality
#   areas:
#     valley-north: [Springfield, Shelbyville]
#     valley-south: [Ogdenville]

# Dataspace binding — OPTIONAL, and per community rather than per deployment.
# Omit the whole block and this community runs the full wizard, collects no
# sharing consent and provisions no dataspace identity: a supported setup, not a
# degraded one. Onboarding must keep working with no dataspace infrastructure.
#
# `organization` is ONE identifier across the platform: the owner `id` in the
# deployment's owners.yaml, the Keycloak organization alias, and the owner id in
# the identity registry. No mapping table — a typo fails against a name that
# already exists somewhere checkable, and `task import-templates` validates it.
#
# The organization must already exist and be promoted in the identity registry.
# Onboarding never creates it: trust state arrives through the registry's
# verify -> agreement -> credential -> promote chain, seeded by an operator from
# owners.yaml. An organization created from an approval would carry no
# verification, no agreement and so no declared capacity — and capacity is what
# decides whether a recipient is disclosed or has to be consented to separately.
#
# dataspace:
#   organization: example-community
#   organization_did: did:web:example-community.dataspaces.localhost
#   linked_participant_did: did:web:consumer.dataspaces.localhost
#
#   # Where a decision about somebody else's data is recorded.
#   #
#   # A consent is enforced at the connector that SERVES the data. Most of what
#   # this community's members decide is about this community's own datasets, and
#   # goes to DS_CONNECTOR_URL. But a grid operator holds their meter readings:
#   # the decision to release those is enforced by the grid operator's data
#   # plane, so it has to be recorded at the grid operator's connector or it
#   # enforces nothing at all. The community is then the collector — the member's
#   # relationship is with it — and the holder must have recorded this community
#   # as an accepted consent collector for the write to be admitted.
#   #
#   # Configuration, never inferred. An offer's `recipients.recipient` says who
#   # the data goes TO, which is not who holds it: a release offer's recipient is
#   # this community, and the rows are at the grid operator.
#   #
#   # Offers named by no entry stay here, which is every offer in a community
#   # whose data is its own. Registering at a holder also needs
#   # DS_ORG_CLIENT_SECRET — a consent is written as the community, not as this
#   # service — and the member's supply points, which are read from the registry
#   # and sent with the decision because the holder can find their rows no other
#   # way.
#   connectors:
#     - holder: example-dso
#       url: http://connector.example-dso.localhost
#       offers:
#         - meter-data-release

notifications:
  from: "noreply@example.com"
  notify:
    - admin@example.com
  # email: true                         # default true; set false to disable email entirely
  # base_url: "https://onboarding.example.com"  # for download links; defaults to first CORS origin

  # Storage backend — upload submission PDF + documents to external storage.
  # When configured, email contains a link to storage instead of a download link.
  # Without storage, email includes a time-bound download link (DOWNLOAD_TOKEN_TTL, default 72h).
  #
  # Google Drive (per-template service account):
  # storage:
  #   backend: gdrive
  #   folder_id: "1abc..."
  #   credentials_file: "credentials/gdrive-sa.json"
  #
  # S3 / MinIO (secrets via ${VAR} from .env or per-template env_file):
  # storage:
  #   backend: s3
  #   bucket: "${S3_BUCKET}"
  #   endpoint_url: "${S3_ENDPOINT_URL}"
  #   access_key_id: "${S3_ACCESS_KEY_ID}"
  #   secret_access_key: "${S3_SECRET_ACCESS_KEY}"
  #   region: "${S3_REGION}"
  #   prefix: "uploads"
  #   url_expiry_seconds: 604800
  #   env_file: ".env"                   # optional per-template .env override

  # Webhook — POST submission ID on submit for automated processing:
  # webhook:
  #   url: "https://example.com/hooks/onboarding"
  #   secret: "${WEBHOOK_SECRET}"

steps:
  # `statute` is here for the statute consent document, which is required and has
  # nothing to do with the dataspace.
  #
  # It becomes **mandatory** the moment `consent.data_sharing` above is
  # uncommented: the wizard renders the sharing offers in this step and nowhere
  # else, so dropping it then lets the statute checkbox quietly fall back into
  # `consents` while the offers disappear — and every submission records a
  # declined sharing consent nobody was ever shown. It sits after the data steps
  # on purpose: consent asked before the data exists is uninformed.
  - consents
  - personal
  - phone_verify
  - energy
  - statute
  - review

content:
  welcome: content/welcome.md
  consent_intro: content/consent_intro.md
  success: content/success.md
