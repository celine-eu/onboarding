slug: example
name: "CER Valle del Sole"
locale: it

branding:
  primary_color: "#0d9488"
  logo: assets/logo.svg

fields:
  extra:
    - key: property_type
      label: "Tipo di immobile"
      "label:en": "Property type"
      type: select
      step: energy
      options:
        - value: residential
          label: "Abitazione"
          "label:en": "Residential"
        - value: condominium
          label: "Condominio"
          "label:en": "Condominium"
        - value: commercial
          label: "Attivita' commerciale"
          "label:en": "Commercial"
        - value: other
          label: "Altro"
          "label:en": "Other"
    - key: has_pv
      label: "Ho un impianto fotovoltaico"
      "label:en": "I have a photovoltaic system"
      type: boolean
      step: energy
    - key: pv_kwp
      label: "Potenza impianto (kWp)"
      "label:en": "System power (kWp)"
      type: number
      step: energy
      suffix: kWp
      placeholder: "es. 6"
      show_if: { key: has_pv, value: true }
    - key: has_battery
      label: "Ho un sistema di accumulo (batteria)"
      "label:en": "I have a battery storage system"
      type: boolean
      step: energy
      show_if: { key: has_pv, value: true }
    - key: battery_kwh
      label: "Capacita' batteria (kWh)"
      "label:en": "Battery capacity (kWh)"
      type: number
      step: energy
      suffix: kWh
      placeholder: "es. 10"
      show_if: { key: has_battery, value: true }
    - key: has_ev
      label: "Ho un'auto elettrica"
      "label:en": "I have an electric vehicle"
      type: boolean
      step: energy
    - key: has_heat_pump
      label: "Ho una pompa di calore"
      "label:en": "I have a heat pump"
      type: boolean
      step: energy
  hidden: []

consent:
  gdpr:
    version: "1.0"
    file: consent/gdpr.pdf
    required: true
  policy:
    version: "1.0"
    file: consent/policy.pdf
    required: true
  statute:
    version: "1.0"
    file: consent/statute.pdf
    required: true
  # Data-sharing consent — OPTIONAL. GDPR Art. 7(4): REC membership must never be
  # conditioned on dataspace sharing, so the wizard permits completion with this
  # off and can_submit does not list it. No version/file here — the version comes
  # from each offer's consent_text_version served by the connector, so it cannot
  # drift from what ds enforces. `offers` is an optional allow-list; omit it to
  # offer every consent-based offer the connector publishes.
  data_sharing:
    required: false
    offers:
      - household-energy-flexibility

# REC registry binding — OPTIONAL, per community. Omit it and approved
# participants are not registered as community members; the wizard still works.
#
# `area` is a fixed configured value: every member lands in it and a REC manager
# moves them from there. Assigning the right one needs this community's areas to
# be 1-1 with the registry's AND geocoding the supply address against their
# geofences — the data exists but is not carried here yet, and a municipality-name
# heuristic would be quietly wrong. A wrong area is sticky, too: the registry
# refuses to delete an area while members reference it.
#
# No assets are registered. Self-stated answers are declarations, not
# commissioned installations, and a meter's sensor_id only exists after the
# device is installed. The POD *is* tracked — it is known up front and is what
# the distributor keys on.
#
# rec_registry:
#   community: example-community       # community key in the REC registry
#   area: north                        # one of that community's own area keys

# Dataspace binding — OPTIONAL, and per community rather than per deployment.
# Omit the whole block and this community runs the full wizard, collects no
# sharing consent and provisions no dataspace identity: a supported setup, not a
# degraded one. Onboarding must keep working with no dataspace infrastructure.
#
# `organization` is ONE identifier across the platform: the owner `id` in the
# deployment's owners.yaml, the Keycloak organization alias, and the owner id in
# the identity registry. No mapping table — a typo fails against a name that
# already exists somewhere checkable, and `task import-templates` validates it.
#
# The organization must already exist and be promoted in the identity registry.
# Onboarding never creates it: trust state arrives through the registry's
# verify -> agreement -> credential -> promote chain, seeded by an operator from
# owners.yaml. An organization created from an approval would carry no
# verification, no agreement and so no declared capacity — and capacity is what
# decides whether a recipient is disclosed or has to be consented to separately.
#
# dataspace:
#   organization: example-community
#   organization_did: did:web:example-community.dataspaces.localhost
#   linked_participant_did: did:web:consumer.dataspaces.localhost
#   membership_role: member

notifications:
  from: "noreply@example.com"
  notify:
    - admin@example.com
  # email: true                         # default true; set false to disable email entirely
  # base_url: "https://onboarding.example.com"  # for download links; defaults to first CORS origin

  # Storage backend — upload submission PDF + documents to external storage.
  # When configured, email contains a link to storage instead of a download link.
  # Without storage, email includes a time-bound download link (DOWNLOAD_TOKEN_TTL, default 72h).
  #
  # Google Drive (per-template service account):
  # storage:
  #   backend: gdrive
  #   folder_id: "1abc..."
  #   credentials_file: "credentials/gdrive-sa.json"
  #
  # S3 / MinIO (secrets via ${VAR} from .env or per-template env_file):
  # storage:
  #   backend: s3
  #   bucket: "${S3_BUCKET}"
  #   endpoint_url: "${S3_ENDPOINT_URL}"
  #   access_key_id: "${S3_ACCESS_KEY_ID}"
  #   secret_access_key: "${S3_SECRET_ACCESS_KEY}"
  #   region: "${S3_REGION}"
  #   prefix: "uploads"
  #   url_expiry_seconds: 604800
  #   env_file: ".env"                   # optional per-template .env override

  # Webhook — POST submission ID on submit for automated processing:
  # webhook:
  #   url: "https://example.com/hooks/onboarding"
  #   secret: "${WEBHOOK_SECRET}"

steps:
  - consents
  - personal
  - phone_verify
  - energy
  - review

content:
  welcome: content/welcome.md
  consent_intro: content/consent_intro.md
  success: content/success.md
