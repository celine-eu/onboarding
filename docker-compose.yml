services:
  init-db:
    image: postgres:16-alpine
    environment:
      PGHOST: ${DB_HOST:-172.17.0.1}
      PGPORT: ${DB_PORT:-15432}
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-securepassword123}
    entrypoint: >
      sh -c '
        until pg_isready; do sleep 1; done
        psql -tc "SELECT 1 FROM pg_database WHERE datname = '"'"'rec_onboarding'"'"'" | grep -q 1 ||
          psql -c "CREATE DATABASE rec_onboarding"
        echo "Database rec_onboarding ready"
      '
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-securepassword123}@${DB_HOST:-172.17.0.1}:${DB_PORT:-15432}/rec_onboarding
    command: uv run alembic upgrade head
    depends_on:
      init-db:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-securepassword123}@${DB_HOST:-postgres}:${DB_PORT:-5432}/rec_onboarding
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: uv run uvicorn celine.onboarding.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./ui/src:/app/src
    depends_on:
      - backend
