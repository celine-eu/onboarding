services:
  init-db:
    image: postgres:16-alpine
    environment:
      PGHOST: ${DB_HOST:-172.17.0.1}
      PGPORT: ${DB_PORT:-15432}
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-securepassword123}
    entrypoint: >
      sh -c '
        until pg_isready; do sleep 1; done
        psql -tc "SELECT 1 FROM pg_database WHERE datname = '"'"'rec_onboarding'"'"'" | grep -q 1 ||
          psql -c "CREATE DATABASE rec_onboarding"
        echo "Database rec_onboarding ready"
      '
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-securepassword123}@${DB_HOST:-172.17.0.1}:${DB_PORT:-15432}/rec_onboarding
    command: uv run alembic upgrade head
    depends_on:
      init-db:
        condition: service_completed_successfully
    restart: "no"

  seed-templates:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-securepassword123}@${DB_HOST:-172.17.0.1}:${DB_PORT:-15432}/rec_onboarding
      # A template that declares boundaries is checked against the Digital Twin
      # (`boundary_shape`) before it is imported, as svc-onboarding — the same
      # address and client the backend uses.
      DIGITAL_TWIN_URL: ${DIGITAL_TWIN_URL:-http://host.docker.internal:8002}
      OIDC_BASE_URL: ${OIDC_BASE_URL:-http://keycloak.celine.localhost/realms/celine}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-svc-onboarding}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-svc-onboarding}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.celine.localhost:host-gateway"
    command: uv run onboarding-cli import-templates --all
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8040:8040"
    environment:
      # Passed through with no default: unset is hardened, and every dev default
      # below is then refused at startup. `task dev` exports CELINE_ENV=dev.
      CELINE_ENV: ${CELINE_ENV:-}
      # The same host/port as init-db, migrate and seed-templates above. They
      # disagreed until 2026-09-12: those three created and migrated a database
      # on the host Postgres while this one pointed at `postgres:5432`, a service
      # this file does not define, so `docker compose up` seeded a database the
      # backend could not reach.
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-securepassword123}@${DB_HOST:-172.17.0.1}:${DB_PORT:-15432}/rec_onboarding
      IDENTITY_REGISTRY_URL: ${IDENTITY_REGISTRY_URL:-http://ds-identity-registry:30005}
      # A hostname, not an address: this is compared against the `iss` claim, and
      # Keycloak mints `iss` from its own hostname whatever the caller dialled.
      # Reaching the realm on `host.docker.internal:8080` — as this did — yields
      # an issuer carrying `:8080`, which matches no token minted through the
      # proxy. `extra_hosts` below resolves it in here and /etc/hosts resolves it
      # on the host, so one string serves both sides and matches the app's default.
      OIDC_BASE_URL: ${OIDC_BASE_URL:-http://keycloak.celine.localhost/realms/celine}
      # Off by default on a local stack: no dataspace identity, no share, and the
      # registry member is written as `svc-onboarding` (OIDC_CLIENT_ID below),
      # not as the dataspace client, which only a dataspace host declares.
      DATASPACE_ENABLED: ${DATASPACE_ENABLED:-false}
      # The dataspace's own client. Used only when DATASPACE_ENABLED=true. No
      # default: ds owns this client and its secret, so there is no public dev
      # value, and a made-up one only fails as a 401 at the token endpoint.
      DS_ONBOARDING_CLIENT_ID: ${DS_ONBOARDING_CLIENT_ID:-svc-ds-onboarding}
      DS_ONBOARDING_CLIENT_SECRET: ${DS_ONBOARDING_CLIENT_SECRET:-}
      # The community's own client, `svc-ds-connector-<alias>`, which is what
      # registers a consent — the connector refuses a plain service token there.
      # The id is derived from the REC's `dataspace.organization`, so only the
      # secret is passed. No default: an id can be guessed and a credential
      # cannot, and a made-up one fails as a 401 far from anything saying why.
      DS_ORG_CLIENT_ID: ${DS_ORG_CLIENT_ID:-}
      DS_ORG_CLIENT_SECRET: ${DS_ORG_CLIENT_SECRET:-}
      # celine-policies' provisioning service, which is the only writer of
      # participant accounts in the realm and the only way this service gives
      # anybody a login — it holds no Keycloak grant of its own. INTERNAL
      # address only: the service has no public route and must not be given one.
      # Unset onboards participants without a login, which is supported.
      #
      # On the celine-dev stack it is reached through the proxy's internal-only
      # host (`config/caddy/Caddyfile`, `provisioning.internal.celine.localhost`),
      # resolved to the host gateway by `extra_hosts` below. `provisioning:8010`
      # is a name on celine-policies' own network, which this project does not
      # join, so it resolved nowhere.
      PROVISIONING_URL: ${PROVISIONING_URL:-http://provisioning.internal.celine.localhost}
      # The REC registry (approval registers the member there, the registry
      # sync writes a template's areas) and the Digital Twin (the boundary a
      # supply address falls in). Their host ports on the celine-dev stack,
      # through the host gateway. Empty disables the registry step; a boundary
      # template needs the Digital Twin.
      REC_REGISTRY_URL: ${REC_REGISTRY_URL:-http://host.docker.internal:8004}
      DIGITAL_TWIN_URL: ${DIGITAL_TWIN_URL:-http://host.docker.internal:8002}
      # celine-policies' Mailpit, published on the host's 1025 (UI on
      # http://mailpit.celine.localhost). Keeps nothing from leaving the machine.
      SMTP_HOST: ${SMTP_HOST:-172.17.0.1}
      SMTP_PORT: ${SMTP_PORT:-1025}
      # Admin console. The issuer above is shared: operator tokens and the
      # service's own outbound M2M tokens come from the same realm.
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-svc-onboarding}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-svc-onboarding}
      # Also the credential presented to the provisioning service, the REC
      # registry (without the dataspace) and the Digital Twin: celine's own
      # client, carrying `provisioning.participants.write`,
      # `rec-registry.members.write`, `rec-registry.lookup` and no Keycloak
      # right at all. Required when PROVISIONING_URL is set. The default is the
      # dev realm's public one (celine-policies `clients.yaml`,
      # `SVC_ONBOARDING_SECRET`), as the other services' dev defaults are; a
      # deployment sets its own.
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-svc-onboarding}
      POLICIES_DIR: /app/policies
    # `.env` is gitignored, so a fresh checkout has none — and a plain list entry
    # makes compose refuse to start rather than fall through to the defaults
    # above. Optional is what lets `docker compose up` work on a clone with no
    # configuration at all.
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.celine.localhost:host-gateway"
      - "provisioning.internal.celine.localhost:host-gateway"
    volumes:
      - ./data:/app/data
    depends_on:
      seed-templates:
        condition: service_completed_successfully
    command: uv run uvicorn celine.onboarding.main:app --host 0.0.0.0 --port 8040 --reload

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: http://backend:8040
    volumes:
      - ./ui/src:/app/src
    depends_on:
      - backend
