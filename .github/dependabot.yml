# Dependency update checks. Weekly, one PR per ecosystem group.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps): "
      prefix-development: "chore(deps-dev): "
    groups:
      development-dependencies:
        dependency-type: development
      runtime-dependencies:
        dependency-type: production
        update-types:
          - "patch"
    versioning-strategy: increase-if-necessary

  # The console (SvelteKit, pnpm lockfile).
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ui-deps): "
    groups:
      ui-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci: "
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - "/"
      - "/ui"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker): "
