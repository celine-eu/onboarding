version: "3"

vars:
  SRC_DIR: ./src
  UI_DIR: ./ui

tasks:
  dev:
    desc: Start all services with docker compose
    cmds:
      - docker compose up --build

  run:api:
    desc: Start backend dev server (requires local Postgres)
    dir: "{{.SRC_DIR}}"
    cmds:
      - uv run uvicorn celine.onboarding.main:app --host 0.0.0.0 --port 8040 --reload

  run:ui:
    desc: Start frontend dev server on :3000 (proxies /api to backend)
    dir: "{{.UI_DIR}}"
    cmds:
      # The port is part of the contract, not a preference: a reverse proxy in
      # front of this console routes its pages to :3000, so vite's default 5173
      # serves a working UI that nothing can reach by its real hostname.
      # `--strictPort` so a taken port fails here rather than silently landing
      # on another one and reproducing the same gap.
      - pnpm dev --host 0.0.0.0 --port 3000 --strictPort

  build:
    desc: Build all Docker images
    cmds:
      - docker compose build

  migrate:
    desc: Run Alembic migrations
    cmds:
      - uv run --project src alembic upgrade head

  migration:
    desc: Create a new Alembic migration
    cmds:
      - uv run --project src alembic revision --autogenerate -m "{{.CLI_ARGS}}"

  init-db:
    desc: Create database and run migrations
    cmds:
      - docker compose up -d postgres
      - sleep 3
      - task migrate

  test:
    desc: Run all tests
    cmds:
      - task test:backend
      - task test:frontend

  test:backend:
    desc: Run backend tests
    dir: "{{.SRC_DIR}}"
    cmds:
      - uv run pytest

  test:frontend:
    desc: >-
      Run frontend tests (Playwright). Delegates to the e2e harness: the wizard
      needs the API for its config, and the console needs an issuer to mint an
      operator token from — `pnpm exec playwright test` alone would start a UI
      with nothing behind it.
    cmds:
      - ./scripts/e2e.sh ui

  lint:
    desc: Lint all code
    cmds:
      - task lint:backend
      - task lint:frontend

  lint:backend:
    desc: Lint backend code
    dir: "{{.SRC_DIR}}"
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  lint:frontend:
    desc: Lint frontend code
    dir: "{{.UI_DIR}}"
    cmds:
      - pnpm lint

  import-templates:
    desc: Import template manifests into database
    dir: "{{.SRC_DIR}}"
    cmds:
      - uv run onboarding-cli import-templates {{.CLI_ARGS}}

  admin:
    desc: >-
      Review and enablement commands, e.g.
      `task admin -- review list --rec my-rec` or
      `task admin -- enablement retry REF --rec my-rec --step rec_registry_member`.
      Talks to the API by default; add --local for the no-Keycloak break-glass.
    dir: "{{.SRC_DIR}}"
    cmds:
      - uv run onboarding-cli admin {{.CLI_ARGS}}

  export-csv:
    desc: Export submissions to CSV
    dir: "{{.SRC_DIR}}"
    cmds:
      - uv run onboarding-cli export-csv {{.CLI_ARGS}}

  export-pod-list:
    desc: "Export consented supply points for a distributor (snapshot — re-export on cadence)"
    dir: "{{.SRC_DIR}}"
    cmds:
      - uv run onboarding-cli export-pod-list {{.CLI_ARGS}}

  test:contract:
    desc: |-
      Check this service's calls against the ds it talks to. Needs a live ds and
      every variable below; skips loudly when either is missing, and a skip is
      not a pass.

      Nothing is defaulted, on purpose. This service runs with the dataspace
      switched off, so there is no stack it means by default — a default here
      would name one deployment's hosts and seeded data, and check the suite
      against that while reporting green.

        addresses    DS_CONTRACT_IR_URL, DS_CONTRACT_CONNECTOR_URL,
                     DS_CONTRACT_PROVENANCE_URL
        client       DS_CONTRACT_TOKEN_URL (the realm is inside it),
                     DS_CONTRACT_CLIENT_ID, DS_CONTRACT_CLIENT_SECRET
        seeded data  DS_CONTRACT_OWNER_ID and DS_CONTRACT_OWNER_ALIAS (which
                     must differ — the id/alias check proves nothing where they
                     are the same), DS_CONTRACT_CONSENT_OFFER,
                     DS_CONTRACT_CONTRACT_OFFER, DS_CONTRACT_PROBE_SUBJECT

      The values belong to whichever deployment is being checked, and stay
      there. Point the suite at one with its own env file:

        set -a; . <deployment>/.env.contract; set +a; task test:contract
    dir: "{{.SRC_DIR}}"
    cmds:
      # `-rs` so the skip reasons are printed rather than counted. A check that
      # stopped running has to be visible in the output that says it passed.
      - uv run pytest ../tests/contract -rs {{.CLI_ARGS}}

  test:e2e:
    desc: >-
      End-to-end: a real database, a real app, a real browser.
      `task test:e2e` runs everything; `task test:e2e -- api` or `-- ui` narrows it.
    cmds:
      - ./scripts/e2e.sh {{.CLI_ARGS}}
