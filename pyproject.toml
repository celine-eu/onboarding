[project]
name = "celine-onboarding"
version = "0.1.0"
description = "CER onboarding platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.15",
    "pydantic-settings>=2.9",
    "typer>=0.15",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "openai>=1.82",
    "aiofiles>=24.1",
    "markitdown[pdf]>=0.1.6",
    "pillow>=12.2.0",
    "pyyaml>=6.0.3",
    "fpdf2>=2.8.7",
    "slowapi>=0.1.9",
    "cryptography>=44.0",
    "pymupdf>=1.25",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/celine"]

[tool.hatch.build.sources]
"src" = ""

[project.scripts]
cer = "celine.onboarding.cli.main:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
