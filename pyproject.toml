[project]
name = "celine-onboarding"
version = "0.1.0"
description = "REC onboarding platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.15",
    "pydantic-settings>=2.9",
    "typer>=0.15",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "openai>=1.82",
    "aiofiles>=24.1",
    "markitdown[pdf]>=0.1.6",
    "pillow>=12.2.0",
    "pyyaml>=6.0.3",
    "fpdf2>=2.8.7",
    "slowapi>=0.1.9",
    "cryptography>=44.0",
    "pymupdf>=1.25",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "boto3>=1.35",
    # 1.18.0 is the first release carrying `celine.sdk.provisioning`, which is
    # the only way this service reaches Keycloak at all: it holds no realm grant
    # of its own any more and calls `../celine-policies`' provisioning service
    # instead. There is no fallback path to fall back to, so this is a floor and
    # not a preference — see docs/decisions/ADR-0004.
    #
    # It also carries `ensure_participant(locale=, invite=)` and the `invitation`
    # reason code on its answer, which approval sends and records.
    #
    # 1.17.3 remains the floor for the JWT claim readers this service's
    # authorization is built on: `realm_groups`, which reads the realm level
    # apart from the organization level, and `Organization.type`/`.groups`,
    # which the access policy checks per community. 1.16.0 resolves and then
    # denies every organization-scoped operator, which is what a floor exists to
    # prevent. It also carries `MemberPatch.did`, `lookup_members_by_dids` and
    # `RecRegistryApiError` — the DID write and the supply-point read the POD
    # export is built on, first released in 1.16.0.
    "celine-sdk>=1.18.0",
    "phonenumbers>=8.13",
]

# **Workspace-editable until the next `celine-sdk` release carries the
# provisioning 1.3.0 contract** (requester, 2026-09-14). The floor above stays
# 1.18.0 and the SDK version is not bumped, but 1.18.0 as published cannot read
# a 1.3.0 answer: its generated `InvitationOutcome` has no `cooldown`,
# `send_failed` or `no_email` and raises on them, and its `ProvisioningApiError`
# has no `code`. Approval records those codes and revocation branches on that
# `code`, so what satisfies the floor here is the sibling checkout, regenerated
# against the service's current spec, installed editable.
#
# That makes this a pin to whatever is on one machine's disk. Delete the block
# when a release with the 1.3.0 contract is published, raise the floor to it, and
# `uv lock --upgrade-package celine-sdk` to move back to the registry.
[tool.uv.sources]
celine-sdk = { path = "../celine-sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/celine"]

[tool.hatch.build.sources]
"src" = ""

[project.scripts]
onboarding-cli = "celine.onboarding.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.22",
    # `task lint:backend` runs `ruff check` and `ruff format --check`, and
    # neither could run: ruff was never a dependency, so the task failed with
    # "Failed to spawn: ruff" rather than reporting anything. A lint task that
    # cannot run reads as a lint task that passes.
    "ruff>=0.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The unit suite only. End-to-end tests boot a real app against a real database
# and are opt-in: `task test:e2e`, or point pytest at tests/e2e directly.
testpaths = ["tests"]
# Both are opt-in and for the same reason: they need something the unit suite
# deliberately does not boot. `tests/e2e` wants a real app and database
# (`task test:e2e`); `tests/contract` wants a live ds (`task test:contract`).
norecursedirs = ["tests/e2e", "tests/contract"]
pythonpath = ["src", "tests"]
markers = [
    "e2e: needs a live app and a database (ONBOARDING_E2E_DATABASE_URL)",
    "ds_contract: needs a live ds stack (DS_CONTRACT_*_URL)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# `class X(str, Enum)` -> `StrEnum` is not a formatting change, and these two are
# persisted: `DocumentType` and `SubmissionStatus` back SQLAlchemy `Enum` columns
# and travel in API responses. The two spellings format differently — `f"{x}"` is
# `"SubmissionStatus.APPROVED"` under `(str, Enum)` and `"approved"` under
# `StrEnum` — so adopting it is a deliberate change with a migration question
# attached, not something a lint sweep should decide. Ignored here so the rule
# stops hiding real findings; raise it as its own change.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# The long lines here are the extraction prompt, and the prompt is the product:
# wrapping it splits a literal whose exact wording and whitespace are what the
# model reads. A width rule written for code should not get a vote on it.
"src/celine/onboarding/extractors/openai_extractor.py" = ["E501"]
